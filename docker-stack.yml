
version: "3.9"

services:
  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - target: 8080
        published: 8083
        protocol: tcp
        mode: ingress
    configs:
      - source: gateway_config
        target: /etc/nginx/conf.d/default.conf
    networks:
      - frontend
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  frontend:
    image: mse-2-mock-ssed-frontend:latest
    networks:
      - frontend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  api:
    image: mse-2-mock-ssed-api:latest
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: db
      PGUSER: campus
      PGDATABASE: campushub
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: campus
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_BUCKET: campushub
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    networks:
      - backend
      - data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  worker:
    image: mse-2-mock-ssed-api:latest
    command: ["npm", "run", "worker"]
    environment:
      NODE_ENV: production
      PGHOST: db
      PGUSER: campus
      PGDATABASE: campushub
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: campus
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_BUCKET: campushub
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    networks:
      - backend
      - data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campus
      POSTGRES_DB: campushub
      POSTGRES_PASSWORD: ${PGPASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: campus
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    networks:
      - backend
      - data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - backend
      - data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  mailhog:
    image: mailhog/mailhog:v1.0.1
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

networks:
  frontend:
    driver: overlay
  backend:
    driver: overlay
  data:
    driver: overlay

volumes:
  postgres_data:
  redis_data:
  minio_data:

configs:
  gateway_config:
    file: ./app/nginx.conf
